<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today's Job Matches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1b1b1a; --muted: #6b6b66; --line: #e6e5e0;
  --accent: #2f5bea; --accent-ink: #fff; --chip: #f0efeb;
  --hi: #1f8a4c; --mid: #b7791f; --lo: #8a8a85;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212; --panel: #1b1b1b; --text: #ececea; --muted: #9a9a95; --line: #2b2b2a;
    --accent: #6d8dff; --accent-ink: #0d0d0d; --chip: #262625;
    --hi: #4cc07e; --mid: #e0a64a; --lo: #77776f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, system-ui, sans-serif; }
header { padding: 28px 16px 12px; max-width: 1100px; margin: 0 auto; }
h1 { margin: 0 0 4px; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
.sub { color: var(--muted); }
.stats { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 14px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
.controls { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
.controls .inner { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
input[type=search] { flex: 1 1 220px; min-width: 0; }
label.chk { display: flex; gap: 6px; align-items: center; color: var(--muted); }
main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 60px; }
.count { color: var(--muted); margin: 6px 0 10px; }
.job { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
  display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: start; }
.score { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 17px;
  font-variant-numeric: tabular-nums; border: 3px solid currentColor; }
.score.hi { color: var(--hi); } .score.mid { color: var(--mid); } .score.lo { color: var(--lo); }
.title { font-weight: 600; font-size: 15px; margin: 0; }
.title a { color: inherit; text-decoration: none; } .title a:hover { text-decoration: underline; }
.meta { color: var(--muted); margin: 2px 0 6px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--muted); }
.chip.resume { color: var(--accent); font-weight: 600; }
.chip.sponsor { color: var(--hi); font-weight: 600; }
.desc { color: var(--muted); font-size: 13px; margin-top: 8px; display: none; }
.job.open .desc { display: block; }
.more { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; font: inherit; font-size: 12px; margin-top: 6px; }
.apply { background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600; padding: 9px 16px; border-radius: 8px; white-space: nowrap; display: inline-block; }
.apply:hover { filter: brightness(1.08); }
.empty { text-align: center; color: var(--muted); padding: 60px 0; }
@media (max-width: 640px) {
  .job { grid-template-columns: 48px 1fr; }
  .score { width: 44px; height: 44px; font-size: 14px; }
  .job .actions { grid-column: 1 / -1; }
  .apply { display: block; text-align: center; }
}
</style>
</head>
<body>
<header>
  <h1>Today's Job Matches</h1>
  <div class="sub" id="gen"></div>
  <div class="stats" id="stats"></div>
</header>
<div class="controls"><div class="inner">
  <input type="search" id="q" placeholder="Search title, company, skills…">
  <select id="resume"></select>
  <select id="source"><option value="">All sources</option></select>
  <select id="sort">
    <option value="score">Best match</option>
    <option value="posted">Newest</option>
    <option value="company">Company A–Z</option>
  </select>
  <label class="chk"><input type="checkbox" id="remote"> Remote only</label>
  <label class="chk"><input type="checkbox" id="sponsor"> Sponsorship mentioned</label>
  <label class="chk"><input type="checkbox" id="all"> Show low matches</label>
</div></div>
<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>
<script>
const DATA = {{ data }};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "#";

$("gen").textContent = `Posted today in the US · updated ${DATA.generated_at}`;
const s = DATA.stats;
$("stats").innerHTML = [
  [DATA.jobs.length, "relevant jobs"], [s.companies, "companies"], [s.raw.toLocaleString(), "postings scanned"],
  [DATA.jobs.filter(j => j.score >= DATA.strong_score).length, `strong matches (${DATA.strong_score}+)`],
  [s.sponsors ?? 0, "mention sponsorship"],
  [Object.values(s.blocked || {}).reduce((a, b) => a + b, 0), "hidden: citizenship / clearance / no sponsorship"],
].map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");

$("resume").innerHTML = `<option value="">Best resume</option>` +
  DATA.resumes.map(r => `<option value="${esc(r)}">Score by ${esc(r)}</option>`).join("");
[...new Set(DATA.jobs.map(j => j.source))].sort().forEach(src =>
  $("source").insertAdjacentHTML("beforeend", `<option>${esc(src)}</option>`));

const prefs = (() => { try { return JSON.parse(localStorage.getItem("prefs") || "{}"); } catch { return {}; } })();
for (const k of ["resume", "source", "sort"]) if (prefs[k] != null) $(k).value = prefs[k];
for (const k of ["remote", "all", "sponsor"]) if (prefs[k] != null) $(k).checked = prefs[k];

const cls = v => v >= DATA.strong_score ? "hi" : v >= DATA.min_score ? "mid" : "lo";
const ago = iso => {
  if (!iso) return "";
  const h = Math.round((Date.now() - new Date(iso)) / 36e5);
  return h < 1 ? "just now" : h < 24 ? `${h}h ago` : new Date(iso).toLocaleDateString();
};

function render() {
  const q = $("q").value.toLowerCase().trim(), r = $("resume").value, src = $("source").value;
  const remote = $("remote").checked, all = $("all").checked, sort = $("sort").value, sp = $("sponsor").checked;
  try { localStorage.setItem("prefs", JSON.stringify({resume: r, source: src, sort, remote, all, sponsor: sp})); } catch {}
  const sc = j => r ? (j.scores[r] ?? 0) : j.score;
  let rows = DATA.jobs.filter(j =>
    (all || sc(j) >= DATA.min_score) && (!remote || j.remote) && (!src || j.source === src) &&
    (!sp || j.tags.includes("sponsors")) &&
    (!q || `${j.title} ${j.company} ${j.location} ${j.matched_skills.join(" ")}`.toLowerCase().includes(q)));
  rows.sort(sort === "posted" ? (a, b) => (b.posted_at || "").localeCompare(a.posted_at || "")
          : sort === "company" ? (a, b) => a.company.localeCompare(b.company)
          : (a, b) => sc(b) - sc(a));
  $("count").textContent = `${rows.length} job${rows.length === 1 ? "" : "s"}`;
  $("list").innerHTML = rows.length ? rows.map(j => {
    const v = sc(j), other = Object.entries(j.scores).map(([k, x]) => `${esc(k)} ${Math.round(x)}`).join(" · ");
    return `<article class="job">
      <div class="score ${cls(v)}" title="${other}">${Math.round(v)}</div>
      <div>
        <p class="title"><a href="${esc(safeUrl(j.url))}" target="_blank" rel="noopener">${esc(j.title)}</a></p>
        <div class="meta">${esc(j.company)} · ${esc(j.location)} · ${ago(j.posted_at)}</div>
        <div class="chips">
          <span class="chip resume">${esc(r || j.best_resume)} resume</span>
          <span class="chip">${other}</span>
          ${j.tags.includes("sponsors") ? `<span class="chip sponsor">Sponsors visa</span>` : ""}
          ${j.remote ? `<span class="chip">Remote</span>` : ""}
          <span class="chip">${esc(j.source)}</span>
          ${j.matched_skills.slice(0, 6).map(k => `<span class="chip">${esc(k)}</span>`).join("")}
        </div>
        <div class="desc">${esc(j.description)}…</div>
        <button class="more" onclick="this.closest('.job').classList.toggle('open')">Details</button>
      </div>
      <div class="actions"><a class="apply" href="${esc(safeUrl(j.apply_url))}" target="_blank" rel="noopener">Apply →</a></div>
    </article>`;
  }).join("") : `<div class="empty">No jobs match these filters yet. Try “Show low matches”.</div>`;
}
["q", "resume", "source", "sort", "remote", "all", "sponsor"].forEach(id => $(id).addEventListener("input", render));
render();
</script>
</body>
</html>
